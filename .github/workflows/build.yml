name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  # Ye option aapko GitHub actions me ek "Run workflow" ka manual button dega
  workflow_dispatch: 

jobs:
  build:
    name: Build APK and Provide in Root Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-APK
          # Ye file GitHub par upload kar dega jise aap direct download kar payenge
          path: build/app/outputs/flutter-apk/app-release.apk
