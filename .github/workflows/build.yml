name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Ye aapko GitHub par manual 'Run workflow' ka button dega

jobs:
  build:
    name: Build APK and Provide in Root Artifacts
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 (Required for modern Android builds)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 3: Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 4: Install Packages
      - name: Install Dependencies
        run: flutter pub get

      # Step 5: Repair/Recreate Android platform files (Aapki requirement ke hisaab se)
      - name: Repair and Create Android Files
        run: flutter create . --platforms=android

      # Step 6: Build the Release APK
      - name: Build Android APK
        run: flutter build apk --release

      # Step 7: Upload Artifact (Taki aap GitHub se APK download kar sakein)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
